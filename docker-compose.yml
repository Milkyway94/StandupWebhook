version: '3.8'

services:
  daily-standup-webhook:
    build: .
    image: daily-standup-webhook:latest
    container_name: daily-standup-webhook
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - standup-net

networks:
  standup-net:
    driver: bridge
